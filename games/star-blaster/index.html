<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Star Blaster</title>
<link rel="stylesheet" href="../shared/kit.css">
</head>
<body>
<script src="../shared/kit.js"></script>
<script>
(() => {
  const ID = 'star-blaster', W = 480, H = 720;
  const view = Kit.canvas(W, H), ctx = view.ctx;
  const parts = new Kit.Particles();
  const stars = [...Array(90)].map((_, i) => ({ x: Kit.rand(0, W), y: Kit.rand(0, H), layer: i % 3 }));
  const PUPS = { P: { color: '#facc15', label: 'P' }, S: { color: '#22d3ee', label: 'S' }, H: { color: '#f472b6', label: '♥' } };
  let ship, bullets, ebullets, enemies, pups, rings, score, lives, power, shield, inv, fireT, spawnT, time, nextBoss, bossCount;
  let state = 'menu', best = Kit.getBest(ID), shake = 0, banner = null;

  function reset() {
    ship = { x: W / 2, y: H - 100, r: 14 };
    bullets = []; ebullets = []; enemies = []; pups = []; rings = [];
    score = 0; lives = 3; power = 1; shield = 0; inv = 1.5; fireT = 0; spawnT = 1; time = 0;
    nextBoss = 70; bossCount = 0; parts.clear();
    banner = { text: 'Get ready!', t: 1.5 };
  }
  const diff = () => 1 + time / 35;

  /* ----- spawning ----- */
  function spawnEnemy() {
    const d = diff(), r = Math.random();
    if (r < 0.14) { // V formation of drones
      const cx = Kit.rand(90, W - 90);
      for (let i = -2; i <= 2; i++) enemies.push(mk('drone', cx + i * 34, -20 - Math.abs(i) * 30));
      return;
    }
    const roll = Math.random() * d;
    let type = 'drone';
    if (roll > 2.0) type = 'tank';
    else if (roll > 1.45) type = 'gunner';
    else if (roll > 0.75) type = 'weaver';
    enemies.push(mk(type, Kit.rand(40, W - 40), -30));
  }
  function mk(type, x, y) {
    const d = diff();
    switch (type) {
      case 'drone': return { type, x, y, vy: Kit.rand(150, 200) * Math.min(1.6, 0.9 + d * 0.1), hp: 1, r: 15, score: 100, flash: 0 };
      case 'weaver': return { type, x, x0: Kit.clamp(x, 100, W - 100), y, vy: 110, amp: Kit.rand(40, 90), f: Kit.rand(1.6, 3), ph: Kit.rand(0, 6), t: 0, hp: 2, r: 16, score: 150, flash: 0 };
      case 'gunner': return { type, x, y, ty: Kit.rand(80, 280), hp: 4, r: 19, shootT: 1, life: 7, score: 300, flash: 0, t: 0 };
      case 'tank': return { type, x: Kit.clamp(x, 50, W - 50), y: y - 20, vy: 45, hp: 14, r: 30, shootT: 1.6, score: 600, flash: 0 };
    }
  }
  function spawnBoss() {
    bossCount++;
    const hp = 70 + bossCount * 40;
    enemies.push({ type: 'boss', x: W / 2, y: -90, ty: 140, hp, max: hp, r: 58, shootT: 2, pattern: 0, t: 0, score: 5000, flash: 0 });
    banner = { text: 'WARNING: BOSS!', t: 2.2, color: '#f43f5e' };
    Kit.beep(110, 0.6, 'sawtooth', 0.05, 60);
  }
  const boss = () => enemies.find((e) => e.type === 'boss');

  function shoot(x, y, angle, speed) { ebullets.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, r: 5 }); }
  const aim = (e) => Math.atan2(ship.y - e.y, ship.x - e.x);

  function fire() {
    const y = ship.y - 20;
    if (power === 1) bullets.push({ x: ship.x, y, vx: 0 });
    else if (power === 2) bullets.push({ x: ship.x - 8, y, vx: 0 }, { x: ship.x + 8, y, vx: 0 });
    else bullets.push({ x: ship.x, y, vx: 0 }, { x: ship.x - 10, y, vx: -90 }, { x: ship.x + 10, y, vx: 90 });
    Kit.beep(880, 0.03, 'square', 0.015, -300);
  }

  function explode(x, y, size, colors) {
    parts.burst(x, y, Math.floor(size * 1.2), colors, size * 9, 0.7, 4);
    rings.push({ x, y, r: 4, max: size * 2.2, t: 0 });
    Kit.noise(Math.min(0.5, 0.12 + size / 120), Math.min(0.14, 0.05 + size / 600));
  }

  function hurt() {
    if (inv > 0) return;
    if (shield > 0) { shield = 0; inv = 1; Kit.beep(300, 0.2, 'triangle', 0.05, -150); return; }
    lives--; power = Math.max(1, power - 1); inv = 2.2; shake = 0.4;
    explode(ship.x, ship.y, 26, ['#e0e7ff', '#818cf8', '#facc15']);
    if (lives <= 0) gameOver();
  }

  function killEnemy(e) {
    e.dead = true;
    score += e.score;
    const col = { drone: '#f43f5e', weaver: '#a855f7', gunner: '#f97316', tank: '#22d3ee', boss: '#f43f5e' }[e.type];
    explode(e.x, e.y, e.r, [col, '#fff', '#facc15']);
    const chance = e.type === 'boss' ? 1 : e.type === 'tank' ? 0.45 : e.type === 'gunner' ? 0.15 : 0.06;
    const drops = e.type === 'boss' ? 3 : 1;
    for (let i = 0; i < drops; i++) if (Math.random() < chance) {
      const type = power < 3 && Math.random() < 0.5 ? 'P' : Kit.pick(lives < 3 ? ['S', 'H', 'P'] : ['S', 'P']);
      pups.push({ x: e.x + (i - 1) * 30, y: e.y, type });
    }
    if (e.type === 'boss') { shake = 0.8; banner = { text: 'Boss defeated! +5000', t: 2, color: '#facc15' }; nextBoss = time + 90; }
  }

  /* ----- update ----- */
  function update(dt) {
    for (const s of stars) { s.y += [30, 70, 140][s.layer] * dt * (state === 'play' ? 1 : 0.4); if (s.y > H) { s.y = 0; s.x = Kit.rand(0, W); } }
    parts.update(dt);
    shake = Math.max(0, shake - dt);
    rings = rings.filter((r) => (r.t += dt) < 0.35);
    if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
    if (state !== 'play') return;
    time += dt; inv = Math.max(0, inv - dt); shield = Math.max(0, shield - dt);

    let mx = 0, my = 0;
    if (Kit.down('ArrowLeft', 'KeyA')) mx--;
    if (Kit.down('ArrowRight', 'KeyD')) mx++;
    if (Kit.down('ArrowUp', 'KeyW')) my--;
    if (Kit.down('ArrowDown', 'KeyS')) my++;
    ship.x = Kit.clamp(ship.x + mx * 380 * dt, 20, W - 20);
    ship.y = Kit.clamp(ship.y + my * 380 * dt, 60, H - 30);

    fireT -= dt;
    if (fireT <= 0) { fire(); fireT = 0.14; }
    for (const b of bullets) { b.y -= 760 * dt; b.x += b.vx * dt; }
    bullets = bullets.filter((b) => b.y > -20 && !b.hit);

    if (time >= nextBoss && !boss()) spawnBoss();
    spawnT -= dt;
    if (spawnT <= 0) {
      if (!boss()) spawnEnemy();
      else if (Math.random() < 0.3) enemies.push(mk('drone', Kit.rand(40, W - 40), -20));
      spawnT = Math.max(0.32, 1.15 - diff() * 0.12) * Kit.rand(0.7, 1.3);
    }

    for (const e of enemies) {
      e.flash = Math.max(0, e.flash - dt);
      if (e.type === 'drone') e.y += e.vy * dt;
      else if (e.type === 'weaver') { e.t += dt; e.y += e.vy * dt; e.x = e.x0 + Math.sin(e.t * e.f + e.ph) * e.amp; }
      else if (e.type === 'gunner') {
        e.t += dt; e.life -= dt;
        if (e.life > 0) { e.y += (e.ty - e.y) * Math.min(1, dt * 2); e.x += Math.sin(e.t * 1.5) * 40 * dt; }
        else e.y += 180 * dt;
        e.shootT -= dt;
        if (e.shootT <= 0 && e.y > 20 && e.life > 0) { shoot(e.x, e.y + 14, aim(e), 240); e.shootT = Math.max(0.8, 1.6 - diff() * 0.1); Kit.beep(300, 0.05, 'square', 0.02); }
      } else if (e.type === 'tank') {
        e.y += e.vy * dt;
        e.shootT -= dt;
        if (e.shootT <= 0 && e.y > 0) { for (let i = -2; i <= 2; i++) shoot(e.x, e.y + 20, Math.PI / 2 + i * 0.25, 200); e.shootT = 2.2; }
      } else if (e.type === 'boss') {
        e.t += dt;
        e.y += (e.ty - e.y) * Math.min(1, dt * 1.2);
        e.x = W / 2 + Math.sin(e.t * 0.8) * 140;
        e.shootT -= dt;
        if (e.shootT <= 0 && e.y > 60) {
          e.pattern = (e.pattern + 1) % 3;
          if (e.pattern === 0) { for (let i = 0; i < 18; i++) shoot(e.x, e.y, (i / 18) * Math.PI * 2 + e.t, 170); e.shootT = 1.6; }
          else if (e.pattern === 1) { for (let i = -1; i <= 1; i++) shoot(e.x, e.y + 40, aim(e) + i * 0.18, 280); e.shootT = 0.9; }
          else { for (let i = 0; i < 7; i++) shoot(e.x - 60 + i * 20, e.y + 40, Math.PI / 2, 230); e.shootT = 1.3; }
          Kit.beep(200, 0.08, 'sawtooth', 0.03);
        }
      }
      // player bullets
      for (const b of bullets) {
        if (b.hit || e.dead) continue;
        if ((b.x - e.x) ** 2 + (b.y - e.y) ** 2 < (e.r + 4) ** 2) {
          b.hit = true; e.hp--; e.flash = 0.06;
          parts.burst(b.x, b.y, 3, '#fde68a', 90, 0.25, 3);
          if (e.hp <= 0) killEnemy(e);
        }
      }
      if (!e.dead && (e.x - ship.x) ** 2 + (e.y - ship.y) ** 2 < (e.r + ship.r - 4) ** 2) {
        hurt();
        if (e.type !== 'boss' && e.type !== 'tank') killEnemy(e);
      }
    }
    enemies = enemies.filter((e) => !e.dead && e.y < H + 60);

    for (const b of ebullets) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      if ((b.x - ship.x) ** 2 + (b.y - ship.y) ** 2 < (b.r + ship.r - 6) ** 2) { b.hit = true; hurt(); }
    }
    ebullets = ebullets.filter((b) => !b.hit && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);

    for (const p of pups) {
      p.y += 110 * dt;
      if ((p.x - ship.x) ** 2 + (p.y - ship.y) ** 2 < 32 ** 2) {
        p.got = true;
        Kit.beep(660, 0.12, 'triangle', 0.05, 600);
        if (p.type === 'P') { power = Math.min(3, power + 1); banner = { text: 'Power up!', t: 0.9, color: '#facc15' }; }
        if (p.type === 'S') { shield = 12; banner = { text: 'Shield!', t: 0.9, color: '#22d3ee' }; }
        if (p.type === 'H') { lives = Math.min(5, lives + 1); banner = { text: 'Extra life!', t: 0.9, color: '#f472b6' }; }
      }
    }
    pups = pups.filter((p) => !p.got && p.y < H + 20);
  }

  function gameOver() {
    state = 'over';
    const rec = Kit.submitBest(ID, score);
    best = Kit.getBest(ID);
    setTimeout(() => Kit.overlay({
      title: 'Game Over',
      html: `<div class="big">${score.toLocaleString()}</div><p>Survived ${Kit.fmtTime(time)}</p><p>${rec ? '<span class="gold">New best score!</span>' : 'Best: ' + best.toLocaleString()}</p>`,
      buttons: [{ label: 'Play again', onClick: () => { reset(); state = 'play'; } }]
    }), 900);
  }
  function pause() {
    if (state !== 'play') return;
    state = 'paused';
    Kit.overlay({ title: 'Paused', buttons: [{ label: 'Resume', onClick: () => { state = 'play'; } }, { label: 'Restart', alt: true, onClick: () => { reset(); state = 'play'; } }] });
  }

  /* ----- drawing ----- */
  function drawShip() {
    if (inv > 0 && Math.floor(inv * 12) % 2 && state === 'play') return;
    ctx.save(); ctx.translate(ship.x, ship.y);
    const fl = 10 + Math.random() * 8;
    ctx.fillStyle = '#fb923c';
    ctx.beginPath(); ctx.moveTo(-6, 12); ctx.lineTo(0, 12 + fl); ctx.lineTo(6, 12); ctx.fill();
    ctx.fillStyle = '#fde68a';
    ctx.beginPath(); ctx.moveTo(-3, 12); ctx.lineTo(0, 10 + fl * 0.6); ctx.lineTo(3, 12); ctx.fill();
    const g = ctx.createLinearGradient(0, -24, 0, 14);
    g.addColorStop(0, '#eef2ff'); g.addColorStop(1, '#6366f1');
    ctx.fillStyle = g; ctx.strokeStyle = '#312e81'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(8, -4); ctx.lineTo(20, 10); ctx.lineTo(20, 15); ctx.lineTo(7, 10); ctx.lineTo(0, 14); ctx.lineTo(-7, 10); ctx.lineTo(-20, 15); ctx.lineTo(-20, 10); ctx.lineTo(-8, -4); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#22d3ee'; ctx.beginPath(); ctx.ellipse(0, -6, 4, 8, 0, 0, Math.PI * 2); ctx.fill();
    if (shield > 0) {
      ctx.strokeStyle = 'rgba(34,211,238,' + (shield < 3 ? 0.3 + Math.sin(time * 20) * 0.3 : 0.7) + ')';
      ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  function drawEnemy(e) {
    ctx.save(); ctx.translate(e.x, e.y);
    const lit = e.flash > 0;
    ctx.lineWidth = 2;
    if (e.type === 'drone') {
      ctx.fillStyle = lit ? '#fff' : '#f43f5e'; ctx.strokeStyle = '#881337';
      ctx.beginPath(); ctx.moveTo(0, 16); ctx.lineTo(16, -10); ctx.lineTo(6, -6); ctx.lineTo(0, -14); ctx.lineTo(-6, -6); ctx.lineTo(-16, -10); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fde68a'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
    } else if (e.type === 'weaver') {
      ctx.rotate(Math.sin(e.t * e.f + e.ph) * 0.4);
      ctx.fillStyle = lit ? '#fff' : '#a855f7'; ctx.strokeStyle = '#3b0764';
      ctx.beginPath(); ctx.moveTo(0, 17); ctx.lineTo(17, 0); ctx.lineTo(0, -17); ctx.lineTo(-17, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f0abfc'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
    } else if (e.type === 'gunner') {
      ctx.fillStyle = lit ? '#fff' : '#f97316'; ctx.strokeStyle = '#7c2d12';
      ctx.beginPath();
      for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; ctx.lineTo(Math.cos(a) * 19, Math.sin(a) * 19); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.rotate(aim(e) - Math.PI / 2);
      ctx.fillStyle = '#431407'; ctx.fillRect(-3, 4, 6, 16);
      ctx.fillStyle = '#fed7aa'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
    } else if (e.type === 'tank') {
      ctx.fillStyle = lit ? '#fff' : '#0891b2'; ctx.strokeStyle = '#083344';
      Kit.rr(ctx, -30, -24, 60, 48, 12); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#22d3ee'; Kit.rr(ctx, -18, -14, 36, 28, 8); ctx.fill();
      ctx.fillStyle = '#083344'; for (const x of [-16, -8, 0, 8, 16]) ctx.fillRect(x - 2, 20, 4, 10);
    } else if (e.type === 'boss') {
      ctx.fillStyle = lit ? '#fff' : '#be123c'; ctx.strokeStyle = '#4c0519'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, 50); ctx.lineTo(60, 10); ctx.lineTo(70, -30); ctx.lineTo(30, -20); ctx.lineTo(0, -45); ctx.lineTo(-30, -20); ctx.lineTo(-70, -30); ctx.lineTo(-60, 10); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fb7185'; ctx.beginPath(); ctx.ellipse(0, 0, 26, 18, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fde68a'; ctx.beginPath(); ctx.arc(0, 0, 9 + Math.sin(e.t * 6) * 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#4c0519'; for (const x of [-60, -20, 20, 60]) ctx.fillRect(x - 4, 14, 8, 16);
    }
    ctx.restore();
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate(Kit.rand(-8, 8) * shake, Kit.rand(-8, 8) * shake);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#05061a'); bg.addColorStop(1, '#16123a');
    ctx.fillStyle = bg; ctx.fillRect(-10, -10, W + 20, H + 20);
    for (const s of stars) {
      ctx.fillStyle = ['#475569', '#94a3b8', '#e2e8f0'][s.layer];
      ctx.fillRect(s.x, s.y, s.layer + 1, s.layer + 1 + (s.layer === 2 ? 2 : 0));
    }
    for (const p of pups) {
      const info = PUPS[p.type];
      ctx.fillStyle = info.color; ctx.shadowColor = info.color; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(p.x, p.y, 13, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
      Kit.text(ctx, info.label, p.x, p.y + 1, { size: 15, weight: 900, color: '#0b1124' });
    }
    ctx.fillStyle = '#fde68a'; ctx.shadowColor = '#facc15'; ctx.shadowBlur = 8;
    for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 9, 4, 16);
    ctx.shadowBlur = 0;
    enemies.forEach(drawEnemy);
    ctx.fillStyle = '#fb7185';
    for (const b of ebullets) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#fff1f2';
    for (const b of ebullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 2, 0, Math.PI * 2); ctx.fill(); }
    if (state !== 'over' || lives > 0) drawShip();
    parts.draw(ctx);
    for (const r of rings) {
      ctx.strokeStyle = 'rgba(253,230,138,' + (1 - r.t / 0.35) + ')'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.max * (r.t / 0.35), 0, Math.PI * 2); ctx.stroke();
    }
    // HUD
    Kit.text(ctx, score.toLocaleString(), 16, 24, { align: 'left', size: 22, weight: 800 });
    for (let i = 0; i < lives; i++) {
      ctx.save(); ctx.translate(W - 22 - i * 26, 24); ctx.scale(0.5, 0.5);
      ctx.fillStyle = '#a5b4fc'; ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(20, 14); ctx.lineTo(-20, 14); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    Kit.text(ctx, 'POWER ' + '▮'.repeat(power) + '▯'.repeat(3 - power), 16, 50, { align: 'left', size: 12, color: '#facc15', weight: 600 });
    const b = boss();
    if (b) {
      ctx.fillStyle = 'rgba(255,255,255,.12)'; Kit.rr(ctx, 90, 64, W - 180, 10, 5); ctx.fill();
      ctx.fillStyle = '#f43f5e'; Kit.rr(ctx, 90, 64, (W - 180) * Math.max(0, b.hp / b.max), 10, 5); ctx.fill();
    }
    if (banner) {
      ctx.globalAlpha = Math.min(1, banner.t * 2);
      Kit.text(ctx, banner.text, W / 2, H * 0.42, { size: 30, weight: 900, color: banner.color || '#fff', stroke: '#05061a', strokeWidth: 6 });
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  window.addEventListener('keydown', (e) => { if (e.code === 'KeyP' || e.code === 'Escape') pause(); });
  window.addEventListener('blur', pause);
  // Drag anywhere to fly: the ship follows your finger's movement, not its position.
  let drag = null;
  document.body.addEventListener('pointerdown', (e) => { if (state === 'play' && !Kit.overlayOpen) drag = { id: e.pointerId, p: view.toLocal(e) }; });
  document.body.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id || state !== 'play') return;
    const p = view.toLocal(e);
    ship.x = Kit.clamp(ship.x + (p.x - drag.p.x) * 1.2, 20, W - 20);
    ship.y = Kit.clamp(ship.y + (p.y - drag.p.y) * 1.2, 60, H - 30);
    drag.p = p;
  });
  window.addEventListener('pointerup', () => { drag = null; });

  reset();
  Kit.overlay({
    title: 'Star Blaster',
    html: '<p>Your ship fires automatically. Dodge enemy fire, grab power-ups and survive the boss waves!</p><p><span style="color:#facc15">P</span> more guns · <span style="color:#22d3ee">S</span> shield · <span style="color:#f472b6">♥</span> extra life</p>',
    buttons: [{ label: 'Play', onClick: () => { reset(); state = 'play'; } }],
    keys: '<kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to fly · <kbd>P</kbd> pause<br>Mouse / touch: drag anywhere to fly'
  });
  Kit.loop((dt) => { update(dt); draw(); }).start();
})();
</script>
</body>
</html>
