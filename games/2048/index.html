<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>2048</title>
<link rel="stylesheet" href="../shared/kit.css">
</head>
<body>
<script src="../shared/kit.js"></script>
<script>
(() => {
  const ID = '2048', W = 500, H = 620, BX = 20, BY = 140, BS = 460, GAP = 14;
  const TS = (BS - GAP * 5) / 4;
  const view = Kit.canvas(W, H), ctx = view.ctx;
  const COLORS = {
    2: '#3b4a7a', 4: '#4c5d9a', 8: '#f59e0b', 16: '#f97316', 32: '#ef4444', 64: '#e11d48',
    128: '#a855f7', 256: '#8b5cf6', 512: '#6366f1', 1024: '#06b6d4', 2048: '#22c55e'
  };
  const SLIDE = 0.11, POP = 0.14;
  const NEW_BTN = { x: 360, y: 84, w: 120, h: 38 };
  let grid, score, best = Kit.getBest(ID), won, over, animT = 1, floats = [];

  const empty = () => [...Array(4)].map(() => Array(4).fill(null));
  const tiles = () => grid.flat().filter(Boolean);
  const cellX = (c) => BX + GAP + c * (TS + GAP);
  const cellY = (r) => BY + GAP + r * (TS + GAP);

  function addRandom() {
    const free = [];
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!grid[r][c]) free.push([r, c]);
    if (!free.length) return;
    const [r, c] = Kit.pick(free);
    grid[r][c] = { v: Math.random() < 0.9 ? 2 : 4, r, c, fr: r, fc: c, born: true };
  }

  function newGame() {
    grid = empty(); score = 0; won = false; over = false; floats = [];
    addRandom(); addRandom();
    animT = 0; save();
  }

  function save() {
    Kit.store.set('2048:state', over ? null : { cells: grid.map((row) => row.map((t) => (t ? t.v : 0))), score, won });
  }
  function load() {
    const s = Kit.store.get('2048:state', null);
    if (!s || !s.cells) return false;
    grid = empty();
    s.cells.forEach((row, r) => row.forEach((v, c) => { if (v) grid[r][c] = { v, r, c, fr: r, fc: c, born: true }; }));
    score = s.score || 0; won = !!s.won; over = false; floats = []; animT = 0;
    return tiles().length > 0;
  }

  function canMove() {
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      const t = grid[r][c];
      if (!t) return true;
      if (c < 3 && grid[r][c + 1] && grid[r][c + 1].v === t.v) return true;
      if (r < 3 && grid[r + 1][c] && grid[r + 1][c].v === t.v) return true;
    }
    return false;
  }

  function move(dir) {
    if (over || Kit.overlayOpen) return;
    const V = { left: [0, -1], right: [0, 1], up: [-1, 0], down: [1, 0] }[dir];
    if (!V) return;
    const [dr, dc] = V;
    for (const t of tiles()) { t.fr = t.r; t.fc = t.c; t.from = null; t.born = false; t.justMerged = false; }
    const rows = [0, 1, 2, 3], cols = [0, 1, 2, 3];
    if (dr === 1) rows.reverse();
    if (dc === 1) cols.reverse();
    const inB = (r, c) => r >= 0 && r < 4 && c >= 0 && c < 4;
    let moved = false, gained = 0;
    for (const r of rows) for (const c of cols) {
      const t = grid[r][c];
      if (!t) continue;
      let pr = r, pc = c;
      while (inB(pr + dr, pc + dc) && !grid[pr + dr][pc + dc]) { pr += dr; pc += dc; }
      const nr = pr + dr, nc = pc + dc;
      const next = inB(nr, nc) ? grid[nr][nc] : null;
      grid[r][c] = null;
      if (next && next.v === t.v && !next.justMerged) {
        const m = { v: t.v * 2, r: nr, c: nc, fr: nr, fc: nc, from: [t, next], justMerged: true };
        t.r = nr; t.c = nc;
        grid[nr][nc] = m;
        gained += m.v; moved = true;
        if (m.v === 2048 && !won) won = 'new';
      } else {
        grid[pr][pc] = t;
        if (pr !== r || pc !== c) moved = true;
        t.r = pr; t.c = pc;
      }
    }
    if (!moved) return;
    animT = 0;
    if (gained) {
      score += gained;
      floats.push({ v: gained, t: 0 });
      Kit.beep(300 + Math.log2(gained) * 40, 0.06, 'triangle', 0.05);
    } else Kit.beep(200, 0.03, 'sine', 0.03);
    addRandom();
    if (score > best) { best = score; Kit.submitBest(ID, score); }
    if (!canMove()) over = true;
    save();
    if (won === 'new') {
      won = true; save();
      setTimeout(() => Kit.overlay({
        title: 'You made 2048!',
        html: `<div class="big">${score}</div><p>Keep going for an even bigger tile?</p>`,
        buttons: [{ label: 'Keep going' }, { label: 'New game', alt: true, onClick: newGame }]
      }), 350);
    } else if (over) {
      setTimeout(() => Kit.overlay({
        title: 'No more moves',
        html: `<div class="big">${score}</div><p>Best: ${best}</p>`,
        buttons: [{ label: 'Try again', onClick: newGame }]
      }), 450);
    }
  }

  window.addEventListener('keydown', (e) => {
    const d = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' }[e.code];
    if (d) move(d);
    if (e.code === 'KeyR' || e.code === 'KeyN') newGame();
  });
  Kit.swipe(document.body, (d) => { if (d !== 'tap') move(d); }, { min: 22 });
  view.canvas.addEventListener('click', (e) => {
    const p = view.toLocal(e), b = NEW_BTN;
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) newGame();
  });

  function drawTile(v, x, y, s) {
    const cx = x + TS / 2, cy = y + TS / 2, w = TS * s;
    ctx.fillStyle = COLORS[v] || '#facc15';
    Kit.rr(ctx, cx - w / 2, cy - w / 2, w, w, 10 * s);
    ctx.fill();
    const g = ctx.createLinearGradient(0, cy - w / 2, 0, cy + w / 2);
    g.addColorStop(0, 'rgba(255,255,255,.18)');
    g.addColorStop(1, 'rgba(0,0,0,.1)');
    ctx.fillStyle = g;
    Kit.rr(ctx, cx - w / 2, cy - w / 2, w, w, 10 * s);
    ctx.fill();
    const digits = String(v).length;
    const size = (digits <= 2 ? 46 : digits === 3 ? 38 : digits === 4 ? 30 : 24) * s;
    Kit.text(ctx, String(v), cx, cy + 2, { size, weight: 800, color: v >= 8 && !COLORS[v] ? '#3b2a00' : '#fff' });
  }

  function draw(dt) {
    animT = Math.min(animT + dt, SLIDE + POP);
    const slideT = Math.min(1, animT / SLIDE);
    const ease = 1 - Math.pow(1 - slideT, 3);
    const popT = animT > SLIDE ? (animT - SLIDE) / POP : 0;
    const pop = slideT < 1 ? 0 : 1 + Math.sin(popT * Math.PI) * 0.12;
    const grow = slideT < 1 ? 0 : Math.min(1, 0.3 + popT * 0.9);

    ctx.fillStyle = '#0f1730'; ctx.fillRect(0, 0, W, H);
    Kit.text(ctx, '2048', 22, 58, { align: 'left', size: 64, weight: 900, color: '#facc15' });
    Kit.text(ctx, 'Join the numbers, reach 2048!', 22, 104, { align: 'left', size: 15, weight: 500, color: '#9aa3d6' });
    [['SCORE', score, 250], ['BEST', Math.max(best, score), 368]].forEach(([label, val, x]) => {
      ctx.fillStyle = '#1b2246'; Kit.rr(ctx, x, 18, 112, 54, 10); ctx.fill();
      Kit.text(ctx, label, x + 56, 33, { size: 12, color: '#9aa3d6' });
      Kit.text(ctx, String(val), x + 56, 55, { size: 22, weight: 800 });
    });
    floats = floats.filter((f) => (f.t += dt) < 0.8);
    for (const f of floats) {
      ctx.globalAlpha = 1 - f.t / 0.8;
      Kit.text(ctx, '+' + f.v, 306, 50 - f.t * 50, { size: 20, weight: 800, color: '#86efac' });
      ctx.globalAlpha = 1;
    }
    const b = NEW_BTN;
    ctx.fillStyle = '#5b3df5'; Kit.rr(ctx, b.x, b.y, b.w, b.h, 10); ctx.fill();
    Kit.text(ctx, 'New Game', b.x + b.w / 2, b.y + b.h / 2 + 1, { size: 16 });

    ctx.fillStyle = '#1b2246'; Kit.rr(ctx, BX, BY, BS, BS, 14); ctx.fill();
    ctx.fillStyle = '#252f5c';
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) { Kit.rr(ctx, cellX(c), cellY(r), TS, TS, 10); ctx.fill(); }

    const list = tiles();
    for (const t of list) {
      if (t.from) {
        if (slideT < 1) for (const s of t.from) drawTile(s.v, Kit.lerp(cellX(s.fc), cellX(s.c), ease), Kit.lerp(cellY(s.fr), cellY(s.r), ease), 1);
      } else if (!t.born) {
        drawTile(t.v, Kit.lerp(cellX(t.fc), cellX(t.c), ease), Kit.lerp(cellY(t.fr), cellY(t.r), ease), 1);
      }
    }
    for (const t of list) {
      if (t.from && slideT >= 1) drawTile(t.v, cellX(t.c), cellY(t.r), pop);
      if (t.born && grow > 0) drawTile(t.v, cellX(t.c), cellY(t.r), grow);
    }
  }

  if (!load()) newGame();
  if (!canMove()) newGame();
  Kit.loop((dt) => draw(dt)).start();
})();
</script>
</body>
</html>
